name: Install FluentCI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - name: Verify FluentCI
        run: |
          fluentci --version
          fluentci run --help
          fluentci modules --help
          fluentci studio --help
