name: Run multiline steps

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Create shell pipeline fixture
        run: |
          mkdir -p fixture
          cat > fixture/fluentci.toml <<'TOML'
          [package]
          name = "action-test"
          version = "0.1.0"
          [[steps]]
          name = "hello"
          command = "echo Hello from FluentCI"
          TOML
          echo '[[steps]]' >> fixture/fluentci.toml
          echo 'name = "again"' >> fixture/fluentci.toml
          echo 'command = "echo Hello again"' >> fixture/fluentci.toml
      - uses: ./
        with:
          pipeline: .
          working-directory: fixture
          args: |
            hello
            again
