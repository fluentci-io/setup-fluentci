name: Run a Wasm plugin

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Create compiled plugin fixture
        run: |
          mkdir -p fixture
          python3 - <<'PYTHON'
          from pathlib import Path
          # A valid Wasm module exporting hello() -> i32 with success status 0.
          Path("fixture/hello.wasm").write_bytes(bytes.fromhex(
              "0061736d010000000105016000017f030201000709010568656c6c6f00000a0601040041000b"
          ))
          PYTHON
      - uses: ./
        with:
          wasm: true
          plugin: ./fixture/hello.wasm
          args: hello
